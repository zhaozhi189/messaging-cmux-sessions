# cmux 会话注册表 —— 把「cmux 里的 tab」和「它负责哪个仓库」对上号。
#
# 安装:  cp cmux-sessions.example.conf ~/.claude/cmux-sessions.conf
# 覆盖:  export CMUX_SESSIONS_CONF=/别的/路径.conf
#
# 格式(| 分隔,首列为准;# 开头是注释,空行忽略):
#
#   别名 | cmux tab 标题 | 仓库路径 | 分组 | 说明
#
#   别名        脚本和 agent 用它寻址,稳定不变。tab 被改名时只改这里一行。
#   tab 标题    必须和 cmux 侧栏里显示的完全一致(`cmux tree --all` / `send.sh --list` 里能看到)。
#   仓库路径    审计/协作时用来跑 `git -C <repo> log`;支持 ~。没有仓库就留空。
#   分组        同一产品/同一条协作线的会话放一组,便于 `sessions.sh --group <名字>` 批量查看。
#   说明        给 agent 看的一句话:这个会话是干什么的、归谁管。
#
# 用法示例:
#   send.sh demo-backend "接口已定稿,详见 /tmp/api.md"     # 用别名寻址,不怕 tab 改名
#   sessions.sh --group demo-project --status                  # 看这条线上谁在线、谁在忙
#   git -C "$(sessions.sh --repo demo-backend)" log --oneline -1   # 审计:看它有没有新提交

# 别名          | tab 标题        | 仓库路径                        | 分组     | 说明
demo-backend   | demo-backend   | ~/dev/demo-backend    | demo-project | 后端 Java 服务,接口以它为准
demo-frontend  | demo-frontend  | ~/dev/demo-frontend   | demo-project | 前端,消费 demo-backend 的接口
demo-collector | demo-collector | ~/dev/demo-collector  | demo-project | 采集插件,和后端共用协议定义

docs           | demo-docs      | ~/dev/demo-docs       | meta         | 文档/知识库会话,兼做旁路审计者
registry       | demo-registry  | ~/dev/demo-registry   | meta         | 产品-项目-分支对应关系
